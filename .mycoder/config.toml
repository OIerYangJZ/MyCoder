# Kernel's own project configuration (spec Appendix B).
[project]
name = "kernel"
workspace = "."
reference_roots = ["../reference"]

[model]
# `fake` keeps development offline by default; switch with `mycoder -m balanced`.
default = "fake"

[security]
permission_profile = "workspace-dev"
secret_redaction = true
telemetry_content = false
trace_upload = false

# Deliberately empty of step/tool-call limits: these repeated the defaults
# verbatim, so raising the defaults (ADR-0030) would have left the kernel's own
# workspace — the one its author works in — pinned to the old ones.
[loop]
max_repeated_failures = 3

[shell]
default_network = false
timeout_ms = 120000

[generated_paths]
allow = ["dist/**", "coverage/**", ".cache/**", "target/**", "node_modules/**"]
