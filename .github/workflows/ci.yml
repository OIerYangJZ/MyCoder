name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The kernel has zero *runtime* dependencies (ADR-0009). The only devDependencies
# are the typecheck toolchain, so every job except `static` skips installing
# altogether — a green run with no `install` step is the standing proof that the
# property still holds, and the `static` job asserts it explicitly.

jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Node's type stripping only checks that syntax is erasable, so nothing
      # else in this workflow would catch a type error. `pnpm typecheck` is the
      # only step that does — it is how the `PolicyEngine.combine` ReferenceError
      # was found, on a path the tests reached but never executed.
      - run: pnpm typecheck

      # `pnpm lint` is scripts/lint.ts, not ESLint. It enforces the project's
      # architecture invariants — no raw network client, no ambient environment
      # reaching a child process, no provider names in the agent loop — which
      # are the plan's "Architecture Stop" conditions expressed as a gate.
      - run: pnpm lint

      - run: pnpm format:check

      - name: Assert the runtime dependency set is still empty
        run: |
          node -e '
            const pkg = require("./package.json");
            const runtime = Object.keys(pkg.dependencies ?? {});
            const dev = Object.keys(pkg.devDependencies ?? {});
            const allowedDev = ["typescript", "@types/node", "prettier"];
            const strayDev = dev.filter((d) => !allowedDev.includes(d));
            if (runtime.length) {
              console.error("ADR-0009: expected no runtime dependencies, found:", runtime.join(", "));
              process.exit(1);
            }
            if (strayDev.length) {
              console.error("ADR-0009: devDependencies are limited to the static-check toolchain; found:", strayDev.join(", "));
              process.exit(1);
            }
            console.log("no runtime dependencies, as documented in ADR-0009");
          '

      # Plan §3.3: CI proves the kernel blocks leaks, not that GitHub Secrets
      # inject correctly. A real credential in the environment would make the
      # canary suite test the wrong thing.
      - name: Assert no real credentials are present
        run: |
          node -e '
            const forbidden = Object.keys(process.env).filter((k) =>
              /_API_KEY$|_TOKEN$|_SECRET$|^AWS_|^ANTHROPIC_|^OPENAI_/.test(k) &&
              !["GITHUB_TOKEN"].includes(k) &&
              (process.env[k] ?? "").length > 0
            );
            if (forbidden.length) {
              console.error("CI must not carry real credentials, found:", forbidden.join(", "));
              process.exit(1);
            }
            console.log("no provider credentials in the CI environment");
          '

  packaging:
    name: Distribution Artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.8 §9. A *content* assertion on what `npm pack` produces, not a
      # review of `files` — the two answers diverge exactly when a rule is subtly
      # wrong, which is the only case worth a CI job. A packaging bug that ships
      # `reference/**` violates spec §23 on a consumer's disk, and one that ships
      # `tests/**` puts our canary secrets into every secret scanner's index.
      - run: pnpm package:check

      # ADR-0019 §3: the entry shim has to parse on a runtime that cannot strip
      # types, which is the whole reason it is not TypeScript.
      - run: pnpm test:packaging

  lint-selftest:
    name: Linter Self-Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.3 §39. `pnpm lint` is a release blocker whose own failure mode is
      # silence: a rule whose pattern stops matching reports zero violations,
      # which is what a clean repository looks like. Writing this suite found
      # five rules that could never fire — they matched inside string literals,
      # which the code projection blanks — so the gate had been partly decorative
      # for as long as those rules had existed.
      - run: pnpm lint:selftest

  evidence:
    name: Release Evidence Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.3 §32.1: a checklist item without named evidence is not PASS.
      # This does not run the tests — the jobs below do — it checks that every
      # claim in docs/alpha3-evidence-matrix.md points at something that exists.
      # alpha.2 shipped two prose-only PASS lines that were both false.
      - run: pnpm evidence

  credential-security:
    name: Credential Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.3 §9. Its own job for the same reason the canary suite has one:
      # "the persisted credential is unreachable from the session it serves" is
      # the property that makes `api_key_file` acceptable at all, so its failure
      # should be legible from the run list rather than buried in a combined log.
      - run: pnpm test:credentials

  ssh:
    name: Real SSH Matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.3 §11–§21, against a real OpenSSH server the fixture starts on
      # loopback — real host key, real auth, real remote shell. Not a VPS: same
      # uid, same filesystem, no network hop, and docs/alpha3-ssh-validation.md
      # says so; the authoritative run was against a separate Linux VM.
      #
      # Two suites. `ssh-live` drives the backend directly; `ssh-session` drives
      # the whole kernel over SSH, which is the composition that was recorded as
      # NOT TESTED and turned out to hide two total functional breaks (ADR-0012).
      # Between them they are how eight defects were found, six in the kernel.
      - name: Ensure an sshd binary is present
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server

      - run: pnpm test:ssh

  container:
    name: Container Enforcement (native Linux Docker)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.5 §37: the strongest isolation evidence has to come from a native
      # Linux Docker Engine, because that is the only configuration where the
      # mount and network namespaces are enforced by the host kernel with no VM
      # and no file-sharing layer in between. GitHub's ubuntu runners are exactly
      # that, which is why this job is the one the release claim rests on — the
      # maintainer's macOS runs are Docker Desktop, and §38 says not to call them
      # equivalent.
      - name: Record the runtime for the evidence artifact
        run: |
          docker version
          docker info --format 'OperatingSystem={{.OperatingSystem}} Kernel={{.KernelVersion}} Security={{.SecurityOptions}}'
          uname -a

      # Pulled here, as a setup step. §11: an image pull is a control-plane
      # action and must never happen as a side effect of a tool call, so the
      # backend refuses to run when the image is absent rather than fetching it.
      - name: Pull the container image
        run: docker pull node:22-bookworm

      # KERNEL_CONTAINER_REQUIRED=1 is the §65 rule in one variable: if the
      # runtime is unusable, these suites **fail** instead of skipping. A green
      # CI whose container evidence silently skipped is how an unearned claim
      # reaches a release note.
      - name: Container isolation, conformance and composition
        env:
          KERNEL_CONTAINER: '1'
          KERNEL_CONTAINER_REQUIRED: '1'
        run: |
          node --test --experimental-strip-types \
            "tests/unit/container-plan.test.ts" \
            "tests/live/container-live.test.ts" \
            "tests/live/container-composition.test.ts" \
            "tests/integration/backend-conformance.test.ts" 2>&1 | tee container-test.log

      - name: Assert no container leaked out of the suite
        if: always()
        run: |
          leaked=$(docker ps -a --filter 'name=mycoder-' --format '{{.Names}} {{.Status}}')
          if [ -n "$leaked" ]; then
            echo "containers leaked by the suite:"
            echo "$leaked"
            exit 1
          fi
          echo "no mycoder-* containers remain"

      - name: Upload the container test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-enforcement-log
          path: container-test.log
          retention-days: 14

  native-sandbox:
    name: Native Linux Sandbox (Landlock + seccomp)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.7's headline claim, and alpha.8 §18's second `_REQUIRED` tier. The
      # runner is a native Linux kernel, which is the only place Landlock can be
      # measured rather than assumed — `probeLauncher` asks the machine and the
      # backend claims exactly what it answers.
      - name: Record the kernel and Landlock state for the artifact
        run: |
          uname -a
          cat /sys/kernel/security/lsm 2>/dev/null || echo "no /sys/kernel/security/lsm"
          sysctl kernel.yama.ptrace_scope 2>/dev/null || true

      # ADR-0020: an explicit build step, never a postinstall. The manifest it
      # writes is what the backend verifies at startup.
      - run: pnpm build:sandbox

      # And the identity check, from the outside, before anything trusts it.
      - run: node bin/mycoder.mjs --sandbox-status

      # KERNEL_NATIVE_REQUIRED=1 is the §65/§18 rule in one variable: if Landlock
      # is unavailable these suites **fail** instead of skipping. A green CI whose
      # native evidence silently skipped is how an unearned claim reaches a
      # release note — the same reason the container job sets its own.
      - name: Native sandbox, composition and cross-backend conformance
        env:
          KERNEL_NATIVE: '1'
          KERNEL_NATIVE_REQUIRED: '1'
        run: |
          node --test --experimental-strip-types \
            "tests/live/native-sandbox.test.ts" \
            "tests/live/native-composition.test.ts" \
            "tests/integration/backend-conformance.test.ts" 2>&1 | tee native-test.log

      - name: Upload the native test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-enforcement-log
          path: native-test.log
          retention-days: 14

  delegation:
    name: Delegated Execution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.4 §43. Its own job because "a subagent really runs on the real
      # runtime" is the milestone's central claim, and a failure in it should be
      # legible from the run list rather than buried in a combined test log. The
      # suite includes the delegated security harness (§37, §38), whose canary must
      # stay out of seven sinks including the child's own prompt.
      - run: pnpm test:delegation

  soak:
    name: Delegated Soak x50
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.4 §31 asks for N=50. `pnpm test` runs the same scenario at N=3 so an
      # ordinary run stays fast; this job pins the requirement rather than relying
      # on the file's default, exactly as the determinism job does.
      - run: pnpm test:soak
        env:
          KERNEL_SOAK_REPEATS: 50

  eval-methodology:
    name: Eval Methodology
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.3 §24–§31. The methodology is itself a release gate, so the family
      # split, the omission/wrong-action distinction and the Kernel Correctness
      # arithmetic get executable evidence rather than a description.
      - run: pnpm test:evals

  test:
    name: Unit + Integration / Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` (native type stripping landed in
        # 22.6). 24 is the current line. Both must pass, so a change that only
        # works on the newest runtime is caught here.
        node: [22, 24]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Run the unit and integration suites
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-node-${{ matrix.node }}.log

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-node-${{ matrix.node }}
          path: test-node-${{ matrix.node }}.log
          retention-days: 14

  security:
    name: Security Invariants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # AGENTS.md rule 10: if the canary suite fails, all other work stops.
      # It runs as its own job so that instruction is legible from the run list
      # rather than buried in a combined test log.
      - run: pnpm test:security

  provider:
    name: Offline Provider Fixtures
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # alpha.2 §26: adapter behaviour stays regression-tested with no
      # credential and no network. Live validation is a separate, manually
      # dispatched workflow — this job is what keeps ordinary CI meaningful
      # between live runs.
      - run: pnpm test:model

  replay:
    name: Replay Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Plan §4.2: live terminal state == event-log replay terminal state.
      # If this fails the event log is not a faithful record, which makes both
      # resume and the audit trail unsound — so it gets its own gate.
      - run: pnpm test:replay

  deterministic:
    name: Deterministic Kernel x100
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Spec §28: the fake-provider trajectory must produce one identical event
      # sequence across 100 runs. 100 is also the default, so this job pins the
      # requirement rather than relying on the test file's constant.
      - run: pnpm test:trajectory
        env:
          KERNEL_TRAJECTORY_REPEATS: 100

  evals:
    name: Golden Tasks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Spec §27.2. The runner exits non-zero on any task failure *or* on a
      # single secret-boundary violation, even if every task otherwise passed.
      - run: pnpm eval

  platform:
    name: Platform / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is absent *here* and present in `smoke` below. The full suite
        # assumes POSIX — the local backend spawns `sh`, fixtures use
        # `grep`/`cat` — so running it on Windows would be known-red, which just
        # trains people to ignore a red matrix. The part that must hold
        # everywhere is covered by the smoke job instead.
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # macOS is where the path layer earns its keep: APFS is case-insensitive
      # and stores filenames in NFD, so `.ENV` and a decomposed filename must
      # still hit the protected-path rules.
      #
      # Tee'd to a file and uploaded below. This job failed once on a release
      # commit and the cause was never established, because GitHub serves job logs
      # from a blob host that was unreachable from the machine doing the release —
      # so "green on attempt 2" was the most that could be said. `pipefail` keeps
      # the step's exit status the test runner's rather than tee's.
      - name: Run the platform suite
        shell: bash
        run: |
          set -o pipefail
          pnpm test:platform 2>&1 | tee test-platform-${{ matrix.os }}.log
        env:
          # Portability is the question here, not determinism — the dedicated
          # job above covers the full 100.
          KERNEL_TRAJECTORY_REPEATS: 5

      # `always()`: a failure is exactly when the log is needed, and a pass is when
      # a flake is worth comparing against.
      - name: Upload the platform test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-platform-${{ matrix.os }}
          path: test-platform-${{ matrix.os }}.log
          retention-days: 14

  smoke:
    name: Smoke / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Windows appears here and not in `platform` above, because the smoke
      # suite is exactly the part that must hold on every OS: path
      # canonicalisation and containment, protected-path matching, the
      # permission matrix, secret detection, the parsers, and the CLI starting.
      # The full suite still assumes POSIX (`sh`, `grep`, `cat`), which is a real
      # v0.1 limitation recorded in docs/m2-hardening-report.md rather than
      # hidden behind continue-on-error.
      - run: pnpm test:smoke
